<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>車両詳細｜ドラサポ</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content" id="content"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  Shell.init("fleet", { title: "車両詳細" });
  const db = DB.get();
  const id = UI.qp("id");
  let v = db.vehicles.find(x => x.id === id);
  const content = document.getElementById("content");
  if (v && !v.logs) v.logs = [];
  v ? render() : content.innerHTML = `<div class="empty"><div class="ico">🔍</div><p>車両が見つかりません</p><a class="btn mt-16" href="vehicles.html">一覧へ</a></div>`;

  const TODAY = "2026-07-15";
  function persist(){ DB.save(db); }
  function addLog(dot, h, body){ v.logs.push({ at:TODAY, dot, h, body:body||"", by:"佐々木" }); }

  function render() {
    const drv = v.driver ? DB.driver(db, v.driver) : null;
    content.innerHTML = `
      <div class="breadcrumb"><a href="vehicles.html">車両管理</a> › ${v.plate}</div>
      <div class="page-head">
        <div><h1 style="margin:0">${v.plate}</h1><p style="margin:0">${v.model}・${v.lessor}</p></div>
        <div class="page-head__actions">
          ${UI.vehicleBadge(v.status)}
          <button class="btn btn--primary" onclick="openLog()">＋ 操作・ログを記録</button>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:1.5fr 1fr;gap:16px;align-items:start">
        <div class="grid" style="gap:16px">
          <div class="card">
            <div class="card__head"><h3>車両ログ</h3><button class="btn btn--sm" onclick="openLog()">＋ 記録</button></div>
            <div class="card__body" id="tl"></div>
          </div>
        </div>
        <div class="grid" style="gap:16px">
          <div class="card">
            <div class="card__head"><h3>乗車ドライバー</h3></div>
            <div class="card__body">
              ${drv ? `<div class="person mb-16">${UI.avatar(drv.name)}<div><b>${drv.name}</b><div class="muted small">${DB.company(db,drv.company).name}</div></div></div>
                <div class="row wrap">
                  <a class="btn btn--sm" href="driver-detail.html?id=${drv.id}">詳細 →</a>
                  <button class="btn btn--sm" onclick="openLog('assign')">変更</button>
                  <button class="btn btn--sm btn--danger" onclick="openLog('unassign')">割当を解除</button>
                </div>`
                : `<div class="empty small" style="padding:16px">現在、乗車ドライバーはいません<br>
                   <button class="btn btn--sm btn--primary mt-8" onclick="openLog('assign')">＋ ドライバーを割り当てる</button></div>`}
            </div>
          </div>
          <div class="card">
            <div class="card__head"><h3>リース情報</h3></div>
            <div class="card__body"><dl class="dl">
              <dt>リース元</dt><dd>${v.lessor}</dd>
              <dt>開始日</dt><dd>${v.leaseStart}</dd>
              <dt>終了日</dt><dd>${v.leaseEnd}</dd>
              <dt>月額</dt><dd>${UI.money(v.monthly)}</dd>
            </dl></div>
          </div>
          ${v.repairFrom ? `<div class="card">
            <div class="card__head"><h3>直近の修理</h3></div>
            <div class="card__body"><dl class="dl">
              <dt>入庫</dt><dd>${v.repairFrom}</dd>
              <dt>出庫</dt><dd>${v.repairTo||"作業中"}</dd>
              <dt>費用</dt><dd>${UI.money(v.repairCost)}</dd>
            </dl></div></div>` : ""}
        </div>
      </div>
    `;
    renderTl();
  }

  function renderTl() {
    const items = [...v.logs].sort((a,b)=> (a.at||"").localeCompare(b.at||""));
    document.getElementById("tl").innerHTML = items.length ? `<div class="timeline">` + items.map(i=>
      `<div class="tl-item"><span class="tl-dot ${i.dot||''}"></span><h4>${i.h}</h4><div class="tl-meta">${i.at}${i.by?' ・ '+i.by:''}</div>${i.body?`<div class="tl-body">${i.body}</div>`:''}</div>`).join("") + `</div>`
      : `<div class="empty small">ログはまだありません</div>`;
  }

  // ---- 統合アクション（割当・解除・修理・メモ）＋コメント ----
  let drvCombo = null, pickedDriver = "";
  window.openLog = function(preset) {
    const assigned = !!v.driver;
    const opts = [
      { v:"memo", t:"メモ" },
      { v:"assign", t: assigned ? "ドライバーを変更" : "ドライバーを割当" },
      assigned ? { v:"unassign", t:"ドライバーを解除" } : null,
      { v:"repair_in", t:"修理へ出す" },
      v.status === "repair" ? { v:"repair_out", t:"修理完了（入庫解除）" } : null,
    ].filter(Boolean);
    const def = preset && opts.some(o=>o.v===preset) ? preset : "memo";
    Modal.open(`
      <div class="modal__head"><h3>操作・ログを記録</h3><span class="close" data-close>×</span></div>
      <div class="modal__body">
        <label class="fld mb-16"><span>操作</span>
          <select class="input" id="op" style="width:100%">${opts.map(o=>`<option value="${o.v}"${o.v===def?' selected':''}>${o.t}</option>`).join("")}</select></label>
        <div class="fld mb-16" id="sec_assign" hidden><span>割り当てるドライバー（採用者を検索）</span><div id="drvCombo"></div></div>
        <div id="sec_repair" hidden>
          <div class="form-grid mb-16">
            <label class="fld"><span>入庫日</span><input class="input" type="date" id="rf" value="${TODAY}"></label>
            <label class="fld"><span>出庫予定日</span><input class="input" type="date" id="rt" value="2026-07-25"></label>
            <label class="fld span-2"><span>見積費用</span><input class="input" type="number" id="rc" value="60000"></label>
          </div>
        </div>
        <label class="fld"><span>コメント</span><textarea class="input" id="cmt" rows="3" placeholder="例：田中さんへ納車。走行前点検OK。"></textarea></label>
      </div>
      <div class="modal__foot"><button class="btn" data-close>キャンセル</button><button class="btn btn--primary" onclick="saveOp()">記録する</button></div>
    `);
    pickedDriver = "";
    const op = document.getElementById("op");
    const toggle = () => {
      const val = op.value;
      document.getElementById("sec_assign").hidden = (val !== "assign");
      document.getElementById("sec_repair").hidden = (val !== "repair_in");
      if (val === "assign" && !drvCombo) initDriverCombo();
    };
    op.onchange = toggle; toggle();
  };

  function initDriverCombo() {
    const items = db.drivers.map(d => {
      const cur = d.vehicle ? DB.vehicle(db, d.vehicle) : null;
      return { value:d.id, label: d.name + (cur ? `（${cur.plate}）` : ""), swatch: UI.colorFor(d.name) };
    });
    drvCombo = Combo.create(document.getElementById("drvCombo"), {
      items, value:"", placeholder:"名前で検索して選択",
      onChange: v2 => { pickedDriver = v2; },
    });
  }

  window.saveOp = function() {
    const op = document.getElementById("op").value;
    const cmt = document.getElementById("cmt").value.trim();
    if (op === "assign") {
      if (!pickedDriver) { Toast.show("ドライバーを選択してください","warn"); return; }
      assignDriver(pickedDriver, cmt);
    } else if (op === "unassign") {
      const od = v.driver ? DB.driver(db, v.driver) : null;
      if (od) od.vehicle = null;
      addLog("gray","ドライバーを解除", (od?od.name+"｜":"") + (cmt||"割当を解除"));
      v.driver = null; v.status = "idle";
    } else if (op === "repair_in") {
      v.status = "repair";
      v.repairFrom = document.getElementById("rf").value;
      v.repairTo = document.getElementById("rt").value;
      v.repairCost = +document.getElementById("rc").value || 0;
      addLog("warn","修理工場へ入庫", `出庫予定 ${v.repairTo} ／ 見積 ${UI.money(v.repairCost)}` + (cmt?`｜${cmt}`:""));
    } else if (op === "repair_out") {
      v.status = v.driver ? "active" : "idle";
      addLog("ok","修理完了・出庫", `修理費用 ${UI.money(v.repairCost)}` + (cmt?`｜${cmt}`:""));
    } else {
      if (!cmt) { Toast.show("コメントを入力してください","warn"); return; }
      addLog("", "メモ", cmt);
    }
    drvCombo = null; pickedDriver = "";
    persist(); Modal.close(); render(); Toast.show("記録しました");
  };

  function assignDriver(drvId, comment) {
    const nd = DB.driver(db, drvId);
    if (!nd) return;
    // このドライバーが別の車両に乗っていれば、そちらを解除
    if (nd.vehicle && nd.vehicle !== v.id) {
      const ov = DB.vehicle(db, nd.vehicle);
      if (ov) { ov.driver = null; ov.status = "idle"; if (!ov.logs) ov.logs = []; ov.logs.push({ at:TODAY, dot:"gray", h:"ドライバーを解除（他車両へ異動）", body:nd.name, by:"佐々木" }); }
    }
    // この車両に別のドライバーがいれば解除
    if (v.driver && v.driver !== drvId) { const od = DB.driver(db, v.driver); if (od) od.vehicle = null; }
    v.driver = drvId; nd.vehicle = v.id; v.status = "active";
    addLog("ok", "ドライバーを割当", nd.name + (comment ? `｜${comment}` : ""));
  }
</script>
</body>
</html>
