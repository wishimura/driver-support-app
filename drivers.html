<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドライバー管理｜ドラサポ</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content">
      <div class="fleet-tabs mb-16">
        <a href="vehicles.html">🚐 車両</a>
        <a href="drivers.html" class="is-active">🚚 ドライバー</a>
      </div>

      <div class="page-head">
        <div>
          <h1>ドライバー</h1>
          <p>候補者から採用された人の一覧。車両の割当は「車両」タブから行います</p>
        </div>
        <div class="page-head__actions">
          <a class="btn" href="candidates.html?status=contract">採用済の候補者を見る</a>
        </div>
      </div>

      <div class="grid grid--4 mb-16" id="drvKpi"></div>

      <div class="filters">
        <div class="seg" id="tab">
          <button data-t="all" class="is-active">すべて</button>
          <button data-t="waiting">納車待ち</button>
          <button data-t="delivered">納車済</button>
          <button data-t="training">研修中</button>
          <button data-t="active">稼働中</button>
          <button data-t="paused">解除申請中</button>
        </div>
        <select class="input" id="fCompany"><option value="all">すべての会社</option></select>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table class="tbl">
            <thead><tr>
              <th>ドライバー</th><th>会社</th><th>契約日</th><th>進捗</th><th>担当車両</th><th>ステータス</th><th></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
  Shell.init("fleet", { title: "車両・ドライバー" });
  const db = DB.get();
  let tab = "all", company = "all";
  const cSel = document.getElementById("fCompany");
  db.companies.forEach(co => cSel.insertAdjacentHTML("beforeend", `<option value="${co.id}">${co.name}</option>`));
  cSel.onchange = e => { company = e.target.value; render(); };
  document.querySelectorAll("#tab button").forEach(b => b.onclick = () => { tab = b.dataset.t; document.querySelectorAll("#tab button").forEach(x=>x.classList.toggle("is-active",x===b)); render(); });

  function miniSteps(d) {
    const steps = [
      { done: !!d.contractedAt, l:"契" },
      { done: d.delivered, l:"納" },
      { done: d.trainingDone || !d.trainingDate, l:"研" },
      { done: d.status==="active", l:"稼" },
    ];
    return `<span class="callstages">` + steps.map(s =>
      `<span class="callpill ${s.done?'done-ok':''}" style="width:24px;height:24px;font-size:11px">${s.l}</span>`).join("") + `</span>`;
  }

  function render() {
    const cnt = k => db.drivers.filter(d=>d.status===k).length;
    const kpi = [
      { l:"稼働中", v:cnt("active")+168, i:"truck", c:"ok" },
      { l:"納車待ち", v:cnt("waiting"), i:"clock", c:"warn" },
      { l:"研修中", v:cnt("training"), i:"book", c:"purple" },
      { l:"解除申請中", v:cnt("paused"), i:"alert", c:"danger" },
    ];
    document.getElementById("drvKpi").innerHTML = kpi.map(x=>`
      <div class="card kpi"><div class="kpi__icon" style="background:var(--${x.c}-soft);color:var(--${x.c})">${UI.icon(x.i,20)}</div>
      <div class="kpi__label">${x.l}</div><div class="kpi__value">${x.v}</div></div>`).join("");

    let list = db.drivers.filter(d => (tab==="all"||d.status===tab) && (company==="all"||d.company===company));
    document.getElementById("rows").innerHTML = list.length ? list.map(d => {
      const co = DB.company(db, d.company);
      const veh = d.vehicle ? DB.vehicle(db, d.vehicle) : null;
      return `<tr onclick="location.href='driver-detail.html?id=${d.id}'">
        <td><div class="person">${UI.avatar(d.name)}
          <div><div class="cell-main">${d.name}</div><div class="cell-sub">${d.age}歳・${d.exp?'経験者':'未経験'}</div></div></div></td>
        <td><span class="ctag"><span class="swatch" style="background:${co.color}"></span>${co.name}</span></td>
        <td class="small">${d.contractedAt}</td>
        <td>${miniSteps(d)}</td>
        <td class="small">${veh ? veh.plate : '<span class="muted">未割当</span>'}</td>
        <td>${UI.driverBadge(d.status)}</td>
        <td class="muted">›</td>
      </tr>`;
    }).join("") : `<tr><td colspan="7"><div class="empty"><div class="ico">🚚</div><p>該当するドライバーがいません</p></div></td></tr>`;
  }

  render();
</script>
</body>
</html>
